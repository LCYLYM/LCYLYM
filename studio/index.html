<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="生鱼安乐 LCYLYM 的沉浸式 3D 开源器物志：Agent 基础设施、原生工具与浏览器实验。">
  <meta name="theme-color" content="#070706">
  <title>开源器物志 · LCYLYM</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <style>
    :root {
      --ink: #070706;
      --ink-soft: #0f0f0d;
      --paper: #d8cfbb;
      --paper-bright: #eee6d4;
      --muted: #918979;
      --dim: #625d53;
      --red: #9d302b;
      --red-bright: #c04236;
      --brass: #a48654;
      --line: rgba(216, 207, 187, .17);
      --serif: "Songti SC", "STSong", "Noto Serif CJK SC", Georgia, serif;
      --sans: "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
      --mono: "SFMono-Regular", "JetBrains Mono", Consolas, monospace;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      color: var(--paper);
      background: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    button, a { color: inherit; font: inherit; }
    button:focus-visible, a:focus-visible { outline: 1px solid var(--red-bright); outline-offset: 4px; }

    #scene {
      position: fixed;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }
    body.dragging #scene { cursor: grabbing; }
    body.project-hover #scene { cursor: pointer; }

    .vignette, .grain, .rain-glass {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }
    .vignette {
      background:
        radial-gradient(ellipse at 54% 42%, transparent 33%, rgba(0, 0, 0, .28) 72%, rgba(0, 0, 0, .76) 118%),
        linear-gradient(90deg, rgba(0, 0, 0, .42), transparent 18%, transparent 82%, rgba(0, 0, 0, .42));
    }
    .grain {
      opacity: .16;
      mix-blend-mode: soft-light;
      background-image:
        repeating-radial-gradient(circle at 17% 29%, rgba(255,255,255,.16) 0 .45px, transparent .55px 3px),
        repeating-linear-gradient(103deg, transparent 0 7px, rgba(255,255,255,.035) 8px, transparent 9px 13px);
      background-size: 11px 13px, 17px 19px;
    }
    .rain-glass {
      opacity: .2;
      background: repeating-linear-gradient(104deg, transparent 0 28px, rgba(216,207,187,.04) 29px, transparent 30px 61px);
      animation: rain-glass 12s linear infinite;
    }
    @keyframes rain-glass { to { transform: translate3d(-80px, 44px, 0); } }

    .loader {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 48%, #15130f 0, #080807 48%, #040403 100%);
      transition: opacity .8s ease, visibility .8s ease;
    }
    .loader.done { opacity: 0; visibility: hidden; }
    .loader-inner { width: min(420px, 72vw); text-align: center; }
    .loader-seal {
      display: grid;
      place-items: center;
      width: 54px;
      height: 54px;
      margin: 0 auto 26px;
      border: 1px solid var(--red);
      color: var(--red-bright);
      font: 700 23px/1 var(--serif);
      transform: rotate(-2deg);
      box-shadow: inset 0 0 0 4px rgba(157,48,43,.08);
    }
    .loader-title { font: 500 clamp(23px, 4vw, 38px)/1.2 var(--serif); letter-spacing: .28em; }
    .loader-line { height: 1px; margin: 24px 0 12px; overflow: hidden; background: rgba(216,207,187,.12); }
    .loader-line i { display: block; width: 18%; height: 100%; background: var(--red-bright); animation: load 1.4s ease-in-out infinite; }
    .loader-copy { color: var(--dim); font: 9px/1 var(--mono); letter-spacing: .2em; }
    @keyframes load { 55% { width: 70%; transform: translateX(23%); } 100% { width: 15%; transform: translateX(620%); } }

    .archive-axis {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 20;
      width: 82px;
      border-right: 1px solid rgba(157, 48, 43, .34);
      background: linear-gradient(90deg, rgba(5,5,4,.9), rgba(5,5,4,.28));
      pointer-events: none;
    }
    .seal-mark {
      position: absolute;
      top: max(24px, env(safe-area-inset-top));
      left: 17px;
      display: grid;
      width: 48px;
      height: 48px;
      place-items: center;
      border: 1px solid var(--red);
      color: var(--red-bright);
      background: rgba(7,7,6,.58);
      pointer-events: auto;
      cursor: pointer;
    }
    .seal-mark::before { content: "鱼"; font: 700 22px/1 var(--serif); transform: rotate(-4deg); }
    .seal-mark::after {
      content: "LCYLYM";
      position: absolute;
      top: 58px;
      left: 50%;
      color: var(--red-bright);
      font: 8px/1 var(--mono);
      letter-spacing: .15em;
      transform: translateX(-50%);
    }
    .axis-line {
      position: absolute;
      top: 129px;
      bottom: 122px;
      left: 40px;
      width: 1px;
      background: linear-gradient(var(--red), rgba(164,134,84,.58), rgba(164,134,84,.18));
    }
    .view-nav {
      position: absolute;
      top: 144px;
      bottom: 136px;
      left: 0;
      display: flex;
      width: 81px;
      flex-direction: column;
      justify-content: space-around;
      pointer-events: auto;
    }
    .view-button {
      position: relative;
      min-height: 42px;
      padding: 0 0 0 46px;
      border: 0;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font: 10px/1 var(--serif);
      letter-spacing: .08em;
      text-align: left;
      writing-mode: vertical-rl;
    }
    .view-button::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 36px;
      width: 7px;
      height: 7px;
      border: 1px solid var(--brass);
      background: var(--ink);
      transform: translateY(-50%) rotate(45deg);
      transition: border-color .25s ease, background .25s ease, transform .25s ease;
    }
    .view-button:hover, .view-button.active { color: var(--paper-bright); }
    .view-button.active::before { border-color: var(--red-bright); background: var(--red); transform: translateY(-50%) rotate(45deg) scale(1.2); }
    .axis-foot {
      position: absolute;
      bottom: max(25px, env(safe-area-inset-bottom));
      left: 19px;
      color: var(--dim);
      font: 8px/1.8 var(--mono);
      letter-spacing: .12em;
      writing-mode: vertical-rl;
    }

    .wordmark-rail {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 82px;
      z-index: 11;
      display: flex;
      width: 76px;
      align-items: center;
      justify-content: center;
      border-right: 1px solid rgba(216,207,187,.08);
      pointer-events: none;
    }
    .wordmark {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      color: var(--paper-bright);
      text-shadow: 0 2px 20px rgba(0,0,0,.8);
      writing-mode: vertical-rl;
    }
    .wordmark strong { font: 400 clamp(28px, 3.2vw, 49px)/1 var(--serif); letter-spacing: .08em; }
    .wordmark small { color: var(--brass); font: 9px/1.5 var(--serif); letter-spacing: .26em; }

    .intro {
      position: fixed;
      top: max(30px, env(safe-area-inset-top));
      left: 180px;
      z-index: 10;
      width: min(365px, 35vw);
      pointer-events: none;
      text-shadow: 0 2px 18px rgba(0,0,0,.8);
      transition: opacity .3s ease, transform .3s ease;
    }
    body.inspecting .intro { opacity: .16; transform: translateY(-8px); }
    .intro-kicker { margin-bottom: 12px; color: var(--red-bright); font: 700 8px/1 var(--mono); letter-spacing: .22em; }
    .intro h1 { margin: 0; font: 400 clamp(21px, 2.2vw, 35px)/1.28 var(--serif); letter-spacing: .02em; }
    .intro p { max-width: 31em; margin: 11px 0 0; color: var(--muted); font-size: 11px; line-height: 1.8; }

    .top-controls {
      position: fixed;
      top: max(26px, env(safe-area-inset-top));
      right: 24px;
      z-index: 22;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status, .control {
      min-height: 32px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: rgba(7,7,6,.52);
      backdrop-filter: blur(8px);
      font: 8px/1 var(--mono);
      letter-spacing: .14em;
    }
    .status { display: inline-flex; align-items: center; gap: 8px; padding: 0 11px; }
    .status::before { content: ""; width: 5px; height: 5px; background: var(--red-bright); box-shadow: 0 0 9px rgba(192,66,54,.7); transform: rotate(45deg); }
    .control { padding: 0 11px; cursor: pointer; }
    .control:hover { color: var(--paper-bright); border-color: rgba(164,134,84,.6); background: rgba(15,15,13,.82); }

    .hover-label {
      position: fixed;
      z-index: 25;
      display: none;
      min-width: 128px;
      padding: 8px 10px;
      border-left: 1px solid var(--red-bright);
      color: var(--paper-bright);
      background: linear-gradient(90deg, rgba(7,7,6,.88), rgba(7,7,6,.26));
      font: 9px/1.5 var(--mono);
      letter-spacing: .06em;
      pointer-events: none;
      transform: translate(12px, -50%);
    }
    .hover-label.visible { display: block; }
    .hover-label small { display: block; margin-top: 2px; color: var(--red-bright); font-size: 7px; letter-spacing: .16em; }

    .view-hint {
      position: fixed;
      right: 24px;
      bottom: 82px;
      z-index: 9;
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--dim);
      font: 8px/1 var(--mono);
      letter-spacing: .1em;
      pointer-events: none;
    }
    .view-hint i { display: block; width: 24px; height: 1px; background: var(--red); }

    .project-index {
      position: fixed;
      right: 18px;
      bottom: max(14px, env(safe-area-inset-bottom));
      left: 100px;
      z-index: 21;
      display: grid;
      grid-template-columns: repeat(8, minmax(104px, 1fr));
      overflow-x: auto;
      border-top: 1px solid rgba(164,134,84,.35);
      border-bottom: 1px solid rgba(216,207,187,.11);
      background: linear-gradient(180deg, rgba(7,7,6,.42), rgba(7,7,6,.83));
      backdrop-filter: blur(7px);
      scrollbar-width: none;
    }
    .project-index::-webkit-scrollbar { display: none; }
    .project-button {
      position: relative;
      min-height: 52px;
      padding: 9px 10px 8px;
      border: 0;
      border-right: 1px solid rgba(216,207,187,.10);
      color: var(--muted);
      background: transparent;
      text-align: left;
      cursor: pointer;
    }
    .project-button::after {
      content: "";
      position: absolute;
      right: 9px;
      bottom: -3px;
      width: 5px;
      height: 5px;
      background: var(--red);
      transform: rotate(45deg) scale(0);
      transition: transform .2s ease;
    }
    .project-button:hover, .project-button.active { color: var(--paper-bright); background: rgba(157,48,43,.06); }
    .project-button.active::after { transform: rotate(45deg) scale(1); }
    .project-button small { display: block; margin-bottom: 5px; color: var(--red-bright); font: 7px/1 var(--mono); letter-spacing: .14em; }
    .project-button b { display: block; overflow: hidden; font: 500 8px/1.2 var(--mono); text-overflow: ellipsis; white-space: nowrap; }

    .dossier {
      position: fixed;
      top: 104px;
      right: 24px;
      bottom: 104px;
      z-index: 30;
      width: min(344px, calc(100vw - 124px));
      min-height: 390px;
      padding: 31px 27px 26px;
      border: 1px solid rgba(164,134,84,.42);
      color: var(--paper);
      background:
        linear-gradient(118deg, rgba(157,48,43,.07), transparent 32%),
        linear-gradient(180deg, rgba(15,14,12,.96), rgba(7,7,6,.94));
      box-shadow: -26px 28px 92px rgba(0,0,0,.58), inset 0 0 60px rgba(0,0,0,.25);
      backdrop-filter: blur(12px);
      clip-path: inset(0 0 0 100%);
      transform: translateX(22px);
      transition: clip-path .46s cubic-bezier(.2,.8,.2,1), transform .46s cubic-bezier(.2,.8,.2,1);
    }
    .dossier.open { clip-path: inset(0); transform: none; }
    .dossier::before { content: ""; position: absolute; inset: 9px; border: 1px solid rgba(216,207,187,.08); pointer-events: none; }
    .dossier::after { content: ""; position: absolute; top: 0; right: 0; border-top: 34px solid var(--red); border-left: 34px solid transparent; opacity: .72; }
    .dossier-close {
      position: absolute;
      top: 17px;
      right: 18px;
      z-index: 2;
      width: 29px;
      height: 29px;
      border: 1px solid rgba(216,207,187,.2);
      color: var(--muted);
      background: transparent;
      cursor: pointer;
    }
    .dossier-index { margin: 0 0 32px; color: var(--red-bright); font: 8px/1 var(--mono); letter-spacing: .18em; }
    .dossier-kicker { margin: 0 0 9px; color: var(--brass); font: 9px/1 var(--serif); letter-spacing: .14em; }
    .dossier h2 { margin: 0; color: var(--paper-bright); font: 600 clamp(19px, 2.3vw, 29px)/1.18 var(--serif); overflow-wrap: anywhere; }
    .dossier-rule { position: relative; height: 1px; margin: 19px 0; background: rgba(157,48,43,.45); }
    .dossier-rule::after { content: ""; position: absolute; top: -3px; right: 0; width: 7px; height: 7px; background: var(--red); transform: rotate(45deg); }
    .dossier p { margin: 0; color: #b7ae9c; font: 13px/1.85 var(--serif); }
    .dossier-stack { margin-top: 20px; color: var(--red-bright); font: 8px/1.7 var(--mono); letter-spacing: .08em; }
    .repo-link {
      position: absolute;
      right: 25px;
      bottom: 24px;
      left: 25px;
      display: flex;
      min-height: 42px;
      align-items: center;
      justify-content: space-between;
      padding: 0 13px;
      border: 1px solid rgba(157,48,43,.65);
      color: var(--paper);
      text-decoration: none;
      font: 700 8px/1 var(--mono);
      letter-spacing: .14em;
    }
    .repo-link:hover { color: #f0e8d7; background: #7f2723; }

    .capture-enter {
      display: none;
      position: fixed;
      right: 24px;
      bottom: 81px;
      z-index: 18;
      color: var(--paper);
      font: 8px/1 var(--mono);
      letter-spacing: .14em;
    }
    body.capture .top-controls, body.capture .view-hint, body.capture .hover-label, body.capture .dossier { display: none; }
    body.capture .capture-enter { display: block; }

    @media (max-width: 960px) {
      .wordmark-rail { display: none; }
      .intro { left: 105px; width: min(400px, 52vw); }
      .intro p { display: none; }
      .project-index { left: 91px; grid-template-columns: repeat(8, 126px); }
      .status { display: none; }
    }

    @media (max-width: 680px) {
      .archive-axis {
        inset: auto 0 0 0;
        width: auto;
        height: 64px;
        border-top: 1px solid rgba(157,48,43,.42);
        border-right: 0;
        background: linear-gradient(0deg, rgba(5,5,4,.94), rgba(5,5,4,.36));
      }
      .seal-mark { top: 8px; left: 10px; width: 45px; height: 45px; }
      .seal-mark::after, .axis-line, .axis-foot { display: none; }
      .view-nav { inset: 0 6px 0 62px; width: auto; flex-direction: row; align-items: center; }
      .view-button { min-height: 40px; padding: 19px 4px 0; text-align: center; writing-mode: horizontal-tb; }
      .view-button::before { top: 7px; left: 50%; transform: translateX(-50%) rotate(45deg); }
      .view-button.active::before { transform: translateX(-50%) rotate(45deg) scale(1.2); }
      .intro { top: 18px; left: 17px; width: calc(100vw - 124px); }
      .intro-kicker { margin-bottom: 7px; }
      .intro h1 { font-size: clamp(18px, 5vw, 26px); }
      .top-controls { top: 15px; right: 12px; }
      #reset { display: none; }
      .project-index { right: 8px; bottom: 72px; left: 8px; grid-template-columns: repeat(8, 124px); }
      .view-hint { display: none; }
      .dossier { top: 74px; right: 10px; bottom: 76px; width: calc(100vw - 20px); }
      .capture-enter { bottom: 77px; }
      body.capture .archive-axis { display: none; }
      body.capture .project-index { bottom: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="一座可转动视角、靠近并点选器物的 3D 开源档案馆"></canvas>
  <div class="vignette"></div>
  <div class="grain"></div>
  <div class="rain-glass"></div>

  <div class="loader" id="loader">
    <div class="loader-inner">
      <div class="loader-seal">鱼</div>
      <div class="loader-title">开源器物志</div>
      <div class="loader-line"><i></i></div>
      <div class="loader-copy">ENTERING THE ARCHIVE · LCYLYM</div>
    </div>
  </div>

  <aside class="archive-axis" aria-label="场景导航">
    <button class="seal-mark" id="seal-reset" type="button" aria-label="返回总览"></button>
    <div class="axis-line"></div>
    <nav class="view-nav" id="view-nav">
      <button class="view-button active" type="button" data-view="overview">总览</button>
      <button class="view-button" type="button" data-view="agent">Agent</button>
      <button class="view-button" type="button" data-view="native">原生</button>
      <button class="view-button" type="button" data-view="browser">浏览器</button>
      <button class="view-button" type="button" data-view="about">关于</button>
    </nav>
    <div class="axis-foot">LCYLYM · 2026</div>
  </aside>

  <div class="wordmark-rail" aria-hidden="true">
    <div class="wordmark"><strong>生鱼开源志</strong><small>开源器物 · 作品集</small></div>
  </div>

  <section class="intro" aria-labelledby="hero-title">
    <div class="intro-kicker" data-copy="eyebrow">AN ARCHIVE OF THINGS MADE REAL</div>
    <h1 id="hero-title" data-copy="title">把新东西，接进真实世界。</h1>
    <p data-copy="summary">走进这座档案馆：Agent 基础设施、原生界面与浏览器实验，都以可触碰的器物留在现场。</p>
  </section>

  <div class="top-controls">
    <span class="status">ARCHIVE ACTIVE</span>
    <button class="control" id="language" type="button" aria-label="Switch language">中 / EN</button>
    <button class="control" id="reset" type="button">归位</button>
  </div>

  <div class="hover-label" id="hover-label" aria-hidden="true">
    <span id="hover-title"></span>
    <small>CLICK TO INSPECT</small>
  </div>

  <div class="view-hint"><i></i><span>拖动转身 · 滚轮靠近 · 点击器物</span></div>

  <nav class="project-index" id="project-index" aria-label="Selected open-source projects"></nav>

  <aside class="dossier" id="dossier" aria-live="polite">
    <button class="dossier-close" id="dossier-close" type="button" aria-label="关闭项目卷宗">×</button>
    <div class="dossier-index" id="dossier-index">ARCHIVE 01 / 08</div>
    <div class="dossier-kicker" id="dossier-kicker"></div>
    <h2 id="dossier-title"></h2>
    <div class="dossier-rule"></div>
    <p id="dossier-description"></p>
    <div class="dossier-stack" id="dossier-stack"></div>
    <a class="repo-link" id="repo-link" href="#" target="_blank" rel="noreferrer">打开仓库 <span>↗</span></a>
  </aside>

  <div class="capture-enter">ENTER THE IMMERSIVE ARCHIVE ↗</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/room.js"></script>
  <script src="js/profile-app.js"></script>
</body>
</html>
